name: Lua checks

on:
  push:
    branches: [main, feature/shared-mqtt-gateway]
  pull_request:

jobs:
  syntax-and-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3
      - name: Check Lua syntax
        run: find src tests -name '*.lua' -print0 | xargs -0 -n1 luac5.3 -p
      - name: Run MQTT codec tests
        run: LUA_PATH='./src/?.lua;./src/?/init.lua;;' lua5.3 tests/test_mqtt_codec.lua
