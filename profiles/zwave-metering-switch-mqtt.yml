name: zwave-metering-switch-mqtt
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: powerMeter
    version: 1
  - id: energyMeter
    version: 1
  - id: refresh
    version: 1
  - id: momentary
    version: 1
  categories:
  - name: SmartPlug
preferences:
- name: mqttBrokerHost
  title: MQTT Broker Address
  description: Hostname or IP address of the Home Assistant Mosquitto broker
  required: true
  preferenceType: string
  definition:
    stringType: text
    minLength: 1
    maxLength: 253
- name: mqttBrokerPort
  title: MQTT Broker Port
  description: TCP port of the MQTT broker
  required: true
  preferenceType: integer
  definition:
    minimum: 1
    maximum: 65535
    default: 1883
- name: mqttUsername
  title: MQTT Username
  description: Leave blank if broker authentication is not configured
  required: false
  preferenceType: string
  definition:
    stringType: text
    maxLength: 128
- name: mqttPassword
  title: MQTT Password
  description: Password for the MQTT broker account
  required: false
  preferenceType: string
  definition:
    stringType: password
    maxLength: 256
- name: mqttTopicPrefix
  title: MQTT Topic Prefix
  description: Prefix used for SmartThings device state and command topics
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: stzwave
    minLength: 1
    maxLength: 64
- name: haDiscoveryPrefix
  title: Home Assistant Discovery Prefix
  description: MQTT Discovery prefix configured in Home Assistant
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: homeassistant
    minLength: 1
    maxLength: 64
metadata:
  vid: 68071cb0-4d30-3c8f-82e9-23448dadac16
  mnmn: SmartThingsCommunity
  ocfDeviceType: oic.d.smartplug
